<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: #0d1117;
            color: #e6edf3;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-size: 8rem; margin: 0;
            background: linear-gradient(135deg, #ff7b72, #d2a8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        h2 { font-size: 2rem; margin: 10px 0; }
        p { color: #8b949e; line-height: 1.6; font-size: 1.1rem; }
        a.btn {
            display: inline-block; margin-top: 30px;
            padding: 12px 30px; background-color: #2f81f7;
            color: white; text-decoration: none; border-radius: 8px;
            font-weight: 600; transition: background 0.2s;
        }
        a.btn:hover { background-color: #1f6feb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Oops! Tersesat?</h2>
        <p>Halaman yang Anda cari sudah dihapus, diubah namanya, atau memang tidak pernah ada di server mesin ini.</p>
        <a href="/" class="btn">Kembali ke Beranda</a>
    </div>
</body>
</html>
